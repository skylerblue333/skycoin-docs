name: developer-hub-ci

on:
  push:
    branches: [main, "product/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Runtime dependency audit
        run: npm run audit
      - name: Package dry run
        run: npm pack --dry-run
